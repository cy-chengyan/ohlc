# SPDX-License-Identifier: Apache-2.0
# Start with: ohlcd --config /etc/ohlc/ohlcd.conf
# Validate without opening the database or listening: add --check-config.
# Command-line options override this file. Changes require a restart.
# Keys use the same names and units as command-line options.
# Relative paths are resolved against the process working directory.
# Only whole-line comments are supported. Double quotes preserve outer spaces;
# quoted values are literal, with no escapes, interpolation or includes.

data = /var/lib/ohlc
host = 127.0.0.1
port = 8765
# For a Unix socket, remove host and port above before enabling this setting.
# socket = /run/ohlc/ohlcd.sock

# The engine budget includes indexes, cache and transient engine allocations.
# It is not a limit on total process RSS. Cache must fit within half the budget.
memory-mib = 1024
cache-mib = 64
network-mib = 128
connections = 64
max-tables = 1024
max-cursors = 256
timeout-ms = 30000
query-ms = 30000
read-workers = 0

# File rollover targets; they do not preallocate this much space.
wal-mib = 1024
data-volume-mib = 1048576

# Remote listeners require TLS and at least one credential file.
# Credential files must be owned by the service user, private and not symlinks.
# tls-cert = /etc/ohlc/server.crt
# tls-key = /etc/ohlc/server.key
# read-token-file = /etc/ohlc/read.token
# write-token-file = /etc/ohlc/write.token
