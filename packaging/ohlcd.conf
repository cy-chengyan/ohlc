# SPDX-License-Identifier: Apache-2.0
# RPM defaults: private Unix socket, dedicated service account, fixed data path.
# See /usr/share/doc/ohlc-libs/design.md for network, limits and backup operation.
# Validate edits with: ohlcd --config /etc/ohlc/ohlcd.conf --check-config
# Restart the service after editing. CLI options override this file.
data = /var/lib/ohlc/database
socket = /run/ohlc/ohlcd.sock

memory-mib = 1024
cache-mib = 64
network-mib = 128
connections = 64
max-tables = 1024
max-cursors = 256
timeout-ms = 30000
query-ms = 30000
read-workers = 0
wal-mib = 1024
data-volume-mib = 1048576

# To use TCP, remove socket above and configure a numeric bind address and port.
# A remote address also requires TLS and private credential files.
# host = 127.0.0.1
# port = 8765
# tls-cert = /etc/ohlc/server.crt
# tls-key = /etc/ohlc/server.key
# read-token-file = /etc/ohlc/read.token
# write-token-file = /etc/ohlc/write.token
